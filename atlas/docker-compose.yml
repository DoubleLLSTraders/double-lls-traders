services:
  atlas-api:
    build:
      context: ./api
    ports:
      - "8787:8787"
    env_file:
      - ../.env
    environment:
      - DERIV_APP_ID=${VITE_DERIV_APP_ID:-}
      - DERIV_TOKEN=${VITE_DERIV_TOKEN_DEMO:-}
      - DERIV_REST_URL=${VITE_DERIV_REST_URL:-https://api.derivws.com}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8787

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5433:5432"
    volumes:
      - atlas_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  atlas_pg:
